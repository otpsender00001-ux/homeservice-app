<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - HomeServices</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        /* Nagdagdag ako ng width: 90% at box-sizing para umayos sa maliit na screen */
        .auth-container { width: 90%; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: Arial, sans-serif; box-sizing: border-box; }
        .auth-container h2 { text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>Forgot Password</h2>
        <p style="text-align: center; font-size: 14px;">Ilagay ang iyong registered email para makatanggap ng reset link.</p>
        
        <form id="forgotForm">
            <div class="form-group">
                <input type="email" id="email" placeholder="Juan@example.com" required>
            </div>
            <button type="submit" id="submitBtn">Send Reset Link</button>
        </form>
        
        <div id="message"></div>
        <div style="text-align: center; margin-top: 15px;">
            <a href="login.html" style="text-decoration: none; color: #007bff;">Bumalik sa Login</a>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msgDiv = document.getElementById('message');
            const btn = document.getElementById('submitBtn');

            btn.innerText = "Nagsesend...";
            btn.disabled = true;
            msgDiv.innerText = "";

            try {
                const res = await fetch('../backend/auth/forgot_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `email=${encodeURIComponent(email)}`
                });
                
                const data = await res.json();
                
                msgDiv.style.color = data.status === 'success' ? 'green' : 'red';
                msgDiv.innerText = data.message;
            } catch (error) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = "May problema sa server connection.";
            } finally {
                btn.innerText = "Send Reset Link";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
