<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Technician | ServiQuick</title>

<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/track-tech.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
.map-container {
    height: 100vh;
    position: relative;
}

#map {
    height: 100%;
    width: 100%;
}

/* ✨ SHOPEE-STYLE MOTORCYCLE & TECH MARKER ANIMATION */
.tech-marker-icon {
    background: #ee4d2d;
    border: 3px solid #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    color: white;
    font-size: 16px;
    transition: all 0.5s ease-in-out;
}

/* Bottom card */
.tech-card {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    padding: 20px;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -5px 25px rgba(0,0,0,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    box-sizing: border-box;
}

.tech-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.tech-avatar {
    width: 55px;
    height: 55px;
    background: #fff5f2;
    border: 2px solid #ee4d2d;
    color: #ee4d2d;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
}

.call-btn {
    background: #ee4d2d;
    color: #fff;
    border: none;
    padding: 12px 25px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(238, 77, 45, 0.3);
    transition: 0.2s;
}

.call-btn:hover {
    background: #d73d1a;
}

.locate-btn {
    position: absolute;
    bottom: 110px;
    right: 20px;
    background: #fff;
    padding: 12px;
    border-radius: 50%;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    cursor: pointer;
    z-index: 1000;
    font-size: 18px;
}

/* ✨ MOBILE RESPONSIVE FIX ✨ */
@media (max-width: 768px) {
    .map-container { height: 85vh; }
    .tech-card { flex-direction: column; text-align: center; gap: 15px; padding: 20px; }
    .call-btn { width: 100%; box-sizing: border-box; }
    .locate-btn { bottom: 180px; } 
}
</style>
</head>

<body>

<div class="layout">

<aside class="sidebar">
    <div class="sidebar-header">
        <span class="brand">ServiQuick</span>
        <p class="panel">Customer Portal</p>
    </div>

    <nav class="menu" id="user-menu">
        <a href="user-dashboard.html">🏠 Dashboard</a>
        <a href="user-bookings.html">📅 My Bookings</a>
        <a href="user-services.html">🛠 Book Service</a>
        <a href="user-track-tech.html">📍 Track Tech</a>
        
        <a href="user-profile.html">👤 My Profile</a>
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
        <a href="#" id="logout-btn" style="color: #ef4444; font-weight: bold;">
    🚪 Logout
</a>
    </nav>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let currentUrl = window.location.pathname.split('/').pop();
            let links = document.querySelectorAll('#user-menu a');
            
            links.forEach(link => {
                link.classList.remove('active'); 
                if (currentUrl === '') currentUrl = 'user-dashboard.html';
                
                if (link.getAttribute('href') === currentUrl) {
                    link.classList.add('active'); 
                }
            });
        });
    </script>
</aside>

<main class="main map-container" style="padding: 0;">

<div id="map"></div>

<div class="locate-btn" id="my-location-btn" title="Center to My Location">📍</div>

<div class="tech-card" id="techDetailsCard">
    <div class="tech-info">
        <div class="tech-avatar" id="techAvatarIcon">🛵</div>
        <div style="text-align: left;">
            <h3 id="eta" style="margin: 0; color: #111; font-size: 16px;">Checking status...</h3>
            <p id="tech-name" style="margin: 4px 0 0; color: #666; font-size: 13px;">Verifying active service...</p>
            <p id="tech-phone-display" style="margin: 2px 0 0; color: #ee4d2d; font-size: 12px; font-weight: 600; display: none;"></p>
        </div>
    </div>
    <button class="call-btn" id="callTechBtn" onclick="callTechnician()" style="display: none;">Call Rider</button>
</div>

</main>

</div>

<div id="logout-modal" class="logout-modal">

    <div class="logout-box">

        <h2>Logout</h2>

        <p>
            Are you sure you want to log out of your
            <strong>ServiQuick</strong> account?
        </p>

        <div class="logout-buttons">

            <button id="cancel-logout" class="btn-no">
                No
            </button>

            <button id="confirm-logout" class="btn-yes">
                Yes
            </button>

        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="../assets/js/user-track.js?v=999"></script>

</body>
</html>
