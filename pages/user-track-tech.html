<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Technician | ServiQuick</title>

<link rel="stylesheet" href="../assets/css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
.map-container {
    height: 100vh;
    position: relative;
}

#map {
    height: 100%;
    width: 100%;
}

/* Bottom card */
.tech-card {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    padding: 15px 20px;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    box-sizing: border-box;
}

.tech-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.tech-avatar {
    width: 50px;
    height: 50px;
    background: #eee;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 20px;
}

.call-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
}

.locate-btn {
    position: absolute;
    bottom: 100px;
    right: 15px;
    background: #fff;
    padding: 10px 14px;
    border-radius: 50%;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    cursor: pointer;
    z-index: 1000;
}

/* ✨ MOBILE RESPONSIVE FIX ✨ */
@media (max-width: 768px) {
    .map-container { height: 85vh; }
    .tech-card { flex-direction: column; text-align: center; gap: 15px; padding: 20px; }
    .call-btn { width: 100%; box-sizing: border-box; }
    .locate-btn { bottom: 160px; } /* Itaas para hindi matakpan ng taller na tech-card */
}
</style>
</head>

<body>

<div class="layout">

<aside class="sidebar">
    <div class="sidebar-header">
        <span class="brand">ServiQuick</span>
        <p class="panel">Customer Portal</p>
    </div>

    <nav class="menu" id="user-menu">
        <a href="user-dashboard.html">🏠 Dashboard</a>
        <a href="user-bookings.html">📅 My Bookings</a>
        <a href="user-services.html">🛠 Book Service</a>
        <a href="user-track-tech.html">📍 Track Tech</a>
        
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
        <a href="../backend/auth/logout.php" onclick="return confirm('Are you sure you want to logout?');" style="color: #ef4444; font-weight: bold;">🚪 Logout</a>
    </nav>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let currentUrl = window.location.pathname.split('/').pop();
            let links = document.querySelectorAll('#user-menu a');
            
            links.forEach(link => {
                link.classList.remove('active'); // Alisin ang blue sa lahat muna
                // Kung walang nakuha (nasa root folder), default sa dashboard
                if (currentUrl === '') currentUrl = 'user-dashboard.html';
                
                if (link.getAttribute('href') === currentUrl) {
                    link.classList.add('active'); // Ilagay ang blue kung nasaan kang page
                }
            });
        });
    </script>
</aside>

<main class="main map-container" style="padding: 0;">

<div id="map"></div>

<div class="locate-btn" id="my-location-btn">📍</div>

<div class="tech-card">
    <div class="tech-info">
        <div class="tech-avatar">👤</div>
        <div>
            <h3 id="eta" style="margin: 0;">Checking status...</h3>
            <p id="tech-name" style="margin: 5px 0 0; color: #666; font-size: 13px;">Verifying active service...</p>
        </div>
    </div>
    <button class="call-btn">Call</button>
</div>

</main>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="../assets/js/user-track.js?v=999"></script>

</body>
</html>
