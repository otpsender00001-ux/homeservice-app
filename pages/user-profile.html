<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ServiQuick</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        .info-group input,
        .info-group select,
        .info-group textarea{
            width:100%;
            box-sizing:border-box;
        }

        @media(max-width:768px){
            .personal-info-grid{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="brand">ServiQuick</span>
            <p class="panel">Customer Portal</p>
        </div>

        <nav class="menu" id="user-menu">
            <a href="user-dashboard.html">🏠 Dashboard</a>
            <a href="user-bookings.html">📅 My Bookings</a>
            <a href="user-services.html">🛠 Book Service</a>
            <a href="user-track-tech.html">📍 Track Tech</a>
            <a href="user-profile.html" class="active">👤 My Profile</a>

            <hr style="border:0;border-top:1px solid #ddd;margin:15px 0;">

            <a href="../backend/auth/logout.php"
            onclick="return confirm('Are you sure you want to logout?');"
            style="color:#ef4444;font-weight:bold;">
                🚪 Logout
            </a>
        </nav>
    </aside>

    <main class="main">

        <div class="header">
            <h2>My Profile</h2>
            <p>Manage your personal information.</p>
        </div>

        <div class="profile-container">

            <!-- LEFT CARD -->

            <div class="profile-card avatar-section">

                <div class="avatar-large">
                    <img
                        id="avatar-preview-img"
                        src="../assets/images/default-avatar.png"
                        alt="Avatar"
                        style="width:100%;height:100%;border-radius:50%;object-fit:cover;">
                </div>

                <h3 id="display-name">
                    Loading...
                </h3>

                <p id="display-email">
                    Loading...
                </p>

                <div style="text-align:left;margin-top:25px;border-top:1px solid #eee;padding-top:20px;">

                    <p style="font-size:13px;color:#6b7280;margin-bottom:8px;">
                        <strong>Email:</strong>
                        <span id="display-email2">Loading...</span>
                    </p>

                    <p style="font-size:13px;color:#6b7280;margin-bottom:8px;">
                        <strong>Phone:</strong>
                        <span id="display-phone">Loading...</span>
                    </p>

                    <p style="font-size:13px;color:#6b7280;">
                        <strong>Address:</strong>
                        <span id="display-address">Loading...</span>
                    </p>

                </div>

            </div>

            <!-- RIGHT CARD -->

            <div class="profile-card">

                <form id="profileForm" enctype="multipart/form-data">

                    <div class="section-title">
                        👤 Personal Information
                    </div>

                    <div class="info-group" style="margin-bottom:15px;">

                        <label>Upload Profile Picture</label>

                        <input
                            type="file"
                            id="user_image"
                            name="profile_image"
                            accept="image/*"
                            onchange="previewImage(event)">

                    </div>

                    <div class="personal-info-grid">

                        <div class="info-group">
                            <label>Full Name</label>
                            <input
                                type="text"
                                id="full_name"
                                name="full_name"
                                required>
                        </div>

                        <div class="info-group">
                            <label>Gender</label>

                            <select
                                id="gender"
                                name="gender">

                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Prefer not to say">Prefer not to say</option>

                            </select>

                        </div>

                        <div class="info-group">
                            <label>Birthday</label>

                            <input
                                type="date"
                                id="birthday"
                                name="bday">
                        </div>

                        <div class="info-group">
                            <label>Phone Number</label>

                            <input
                                type="text"
                                id="phone"
                                name="phone">
                        </div>

                    </div>

                    <div class="info-group">

                        <label>Address</label>

                        <input
                            type="text"
                            id="address"
                            name="address">

                    </div>

                    <div class="info-group">

                        <label>Bio</label>

                        <textarea
                            id="bio"
                            name="bio"
                            rows="3"></textarea>

                    </div>

                    <button
                        type="submit"
                        id="saveBtn"
                        class="btn-save">

                        Save All Changes

                    </button>

                </form>

            </div>

        </div>

    </main>

</div>

<script src="../assets/js/user-profile.js"></script>

</body>
</html>
