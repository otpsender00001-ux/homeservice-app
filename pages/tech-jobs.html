<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Jobs | ServiQuick</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .action-btn { border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; transition: 0.3s; width: 100%; margin-top: 10px; }
        .btn-start { background: #ff4500; color: white; box-shadow: 0 4px 10px rgba(255, 69, 0, 0.3); }
        .btn-start:hover { background: #e03e00; }
        .btn-complete { background: #28a745; color: white; box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3); }
        .btn-complete:hover { background: #218838; }
        .btn-chat { background: #17a2b8; color: white; box-shadow: 0 4px 10px rgba(23, 162, 184, 0.3); margin-top: 0; }
        .btn-chat:hover { background: #138496; }
        
        .tracking-indicator { background: rgba(255, 69, 0, 0.1); color: #ff4500; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; display: none; text-align: center; border: 1px solid #ff4500; margin-bottom: 15px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* PROFESSIONAL JOB CARD CSS */
        .job-card-large { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border-top: 5px solid #ddd; display: flex; flex-direction: column; transition: transform 0.2s; }
        .job-card-large:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .job-card-large.active-job { border-top-color: #ff4500; }
        
        .job-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px; }
        .job-card-title { font-size: 18px; font-weight: 800; color: #222; margin: 0; line-height: 1.3; }
        
        .job-badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; margin-left: 10px; }
        .badge-orange { background: #ffe8cc; color: #d97706; }
        .badge-blue { background: #d0ebff; color: #1c7ed6; }
        .badge-green { background: #d3f9d8; color: #2b8a3e; }
        .badge-gray { background: #f1f3f5; color: #868e96; }

        .job-detail-row { display: flex; align-items: flex-start; margin-bottom: 15px; font-size: 14px; }
        .job-detail-icon { font-size: 18px; margin-right: 12px; min-width: 20px; text-align: center; }
        .job-detail-text { color: #555; line-height: 1.5; width: 100%; }
        .job-detail-text strong { color: #888; display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 2px;}
        .job-detail-text .main-text { color: #222; font-weight: 600; font-size: 14px; }
        
        .job-actions { margin-top: auto; padding-top: 15px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #f0f0f0; }

        /* LIVE CHAT MODAL CSS */
        .modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; }
        .modal-content { background:white; width:90%; max-width:400px; padding:20px; border-radius:12px; display:flex; flex-direction:column; box-shadow: 0 5px 15px rgba(0,0,0,0.2); box-sizing: border-box; }
        .chat-box { height: 300px; overflow-y: auto; background: #ffffff; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #eee; }
        .msg { max-width: 75%; padding: 10px 15px; font-size: 14px; line-height: 1.4; word-wrap: break-word; display: inline-block; }
        .msg.mine { background: #0084ff; color: white; align-self: flex-end; border-radius: 18px 18px 2px 18px; margin-left: auto; }
        .msg.theirs { background: #e4e6eb; color: black; align-self: flex-start; border-radius: 18px 18px 18px 2px; margin-right: auto; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .chat-input:focus { border-color: #ee4d2d; }
        .btn-send { background: #ee4d2d; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        /* ✨ MOBILE RESPONSIVE FIX ✨ */
        #jobs-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 15px; }
        @media (max-width: 768px) {
            .job-card-header { flex-direction: column; gap: 10px; }
            .job-badge { margin-left: 0; align-self: flex-start; }
        }
    </style>
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header"><span class="brand">ServiQuick</span><p class="panel">Technician Panel</p></div>
       <nav class="menu" id="tech-menu">
            <a href="tech-dashboard.html">📊 Dashboard</a> 
            <a href="tech-jobs.html">🛠 Jobs</a> 
            <a href="tech-profile.html">👤 Profile</a>
            
            <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
            <a href="../backend/auth/logout.php" onclick="return confirm('Are you sure you want to logout?');" style="color: #ef4444; font-weight: bold;">🚪 Logout</a>
        </nav>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                let currentUrl = window.location.pathname.split('/').pop();
                let links = document.querySelectorAll('#tech-menu a');
                
                links.forEach(link => {
                    link.classList.remove('active'); // Alisin muna ang blue sa lahat
                    // Kung walang nakuhang currentUrl (halimbawa, nasa root folder lang), i-set as default ang dashboard
                    if (currentUrl === '') currentUrl = 'tech-dashboard.html';
                    
                    if (link.getAttribute('href') === currentUrl) {
                        link.classList.add('active'); // Ilagay ang blue kung nasaan kang page
                    }
                });
            });
        </script>
    </aside>

    <main class="main">
        <div class="header">
            <div>
                <h2>Assigned Jobs</h2>
                <p>Manage your tasks and view complete details</p>
            </div>
        </div>

        <div id="gps-status" class="tracking-indicator">📡 LIVE GPS TRACKING ACTIVE - Admin is monitoring your location</div>

        <div id="jobs-container">
            <div style="text-align: center; padding: 40px; color: #888; grid-column: 1 / -1;">
                Loading assigned jobs...
            </div>
        </div>
    </main>
</div>

<div id="chatModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px;">
            <h3 style="margin: 0; color: #333; font-size: 16px;">💬 Chat: <span id="chat-person-name" style="color: #ee4d2d;"></span></h3>
            <span onclick="closeChatModal()" style="cursor: pointer; font-size: 24px; font-weight: bold; color: #aaa; line-height: 1;">&times;</span>
        </div>
        
        <div id="chat-messages" class="chat-box"></div>
        
        <form id="chatForm" class="chat-input-area">
            <input type="file" id="chat-image" accept="image/*" style="display:none;" onchange="document.getElementById('chat-img-btn').style.background='#28a745'; document.getElementById('chat-img-btn').style.color='white';">
            <button type="button" id="chat-img-btn" onclick="document.getElementById('chat-image').click()" style="background:#eee; border:none; padding:10px 15px; border-radius:20px; cursor:pointer; transition:0.3s;">📷</button>
            <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." autocomplete="off">
            <button type="submit" class="btn-send">Send</button>
        </form>
    </div>
</div>

<script src="../assets/js/tech-jobs.js"></script>
</body>
</html>
