<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Set New Password | ServiQuick</title>

<link rel="stylesheet" href="../assets/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
    /* Dagdag na styling para sa countdown at status messages */
    .countdown-box {
        background-color: #fff3cd;
        color: #856404;
        padding: 10px;
        border-radius: 5px;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 20px;
        border: 1px solid #ffeeba;
    }
    .expired-box {
        text-align: center;
        padding: 20px 0;
    }
    .expired-icon {
        font-size: 50px;
        color: #dc3545;
        margin-bottom: 10px;
    }
    .expired-title {
        font-size: 20px;
        font-weight: 700;
        color: #333;
        margin-bottom: 10px;
    }
    .expired-text {
        color: #666;
        font-size: 14px;
        margin-bottom: 20px;
    }
    /* Loader habang chinecheck ang token */
    #loadingState { text-align: center; padding: 30px; color: #666; }

    /* ✨ MOBILE RESPONSIVE FIX ✨ */
    .auth-card {
        width: 90%;
        max-width: 420px;
        box-sizing: border-box;
        margin: 0 auto;
    }
    .form-group input {
        box-sizing: border-box;
        width: 100%;
    }
</style>
</head>

<body>

<div class="auth-container">
    <div class="auth-card">
        
        <div id="loadingState">
            <div style="font-size: 24px; margin-bottom: 10px;">⏳</div>
            <div>Verifying secure link...</div>
        </div>

        <div id="expiredState" class="expired-box" style="display: none;">
            <div class="expired-icon">✖</div>
            <div class="expired-title">Link Expired</div>
            <div class="expired-text">Your password reset link is invalid or has already expired for your security. Please request a new one.</div>
            <a href="login.html" class="btn btn-blue" style="display: inline-block; padding: 10px 20px; text-decoration: none; border-radius: 5px; width: 100%; box-sizing: border-box;">Go back to Login</a>
        </div>

        <div id="formState" style="display: none;">
            <div class="auth-title">Set New Password 🔒</div>
            <div class="auth-sub">Create a strong password for your account</div>

            <div class="countdown-box" id="countdownTimer">
                Time remaining: <span id="timeText">--:--</span>
            </div>

            <form id="resetForm">
                <input type="hidden" id="token">
                
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="password" placeholder="Enter new password" required minlength="6">
                </div>
                
                <div class="form-group" style="margin-bottom: 5px;">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm_password" placeholder="Re-enter new password" required minlength="6">
                </div>
                
                <div id="message" style="margin-top: 10px; margin-bottom: 10px; font-size: 13px; font-weight: 600; text-align: center;"></div>

                <button type="submit" id="submitBtn" class="btn btn-blue" style="width:100%;height:40px;margin-top:10px;">
                    Update Password
                </button>
            </form>
        </div>

    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    const loadingState = document.getElementById('loadingState');
    const expiredState = document.getElementById('expiredState');
    const formState = document.getElementById('formState');
    let countdownInterval;

    // STEP 1: I-validate agad ang token pagka-load ng page
    async function validateToken() {
        if (!token) {
            showExpired();
            return;
        }
        try {
            const response = await fetch(`../backend/auth/validate_token.php?token=${token}`);
            const data = await response.json();

            if (data.status === 'valid') {
                showForm(data.expiry);
            } else {
                showExpired();
            }
        } catch (error) {
            alert("Error connecting to server. Please try again later.");
        }
    }

    // Function para ipakita ang error kung expired na
    function showExpired() {
        loadingState.style.display = 'none';
        formState.style.display = 'none';
        expiredState.style.display = 'block';
    }

    // Function para ipakita ang form at simulan ang timer
    function showForm(expiryString) {
        document.getElementById('token').value = token;
        loadingState.style.display = 'none';
        expiredState.style.display = 'none';
        formState.style.display = 'block';

        // Start Countdown Logic
        // Convert PHP datetime (YYYY-MM-DD HH:MM:SS) to JS friendly format
        const expiryDate = new Date(expiryString.replace(' ', 'T')).getTime();

        countdownInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = expiryDate - now;

            if (distance < 0) {
                // Pag naubos ang oras
                clearInterval(countdownInterval);
                showExpired(); 
            } else {
                // Computin ang minutes at seconds
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                
                // Dagdagan ng 0 sa unahan kung single digit (e.g., 09:05)
                const m = minutes < 10 ? "0" + minutes : minutes;
                const s = seconds < 10 ? "0" + seconds : seconds;

                document.getElementById('timeText').innerText = m + ":" + s;
                
                // Kapag less than 5 mins, gawing red para ma-alarma si user
                if (minutes < 5) {
                    document.getElementById('countdownTimer').style.backgroundColor = '#f8d7da';
                    document.getElementById('countdownTimer').style.color = '#721c24';
                    document.getElementById('countdownTimer').style.border = '1px solid #f5c6cb';
                }
            }
        }, 1000);
    }

    // Patakbuhin ang validation pagkakuha ng file
    validateToken();

    // STEP 2: Ang logic ng mismong pagpapalit ng password (walang binago sa connection sa backend)
    document.getElementById('resetForm').onsubmit = async (e) => {
        e.preventDefault();
        const pass = document.getElementById('password').value;
        const confirmPass = document.getElementById('confirm_password').value;
        const tokenValue = document.getElementById('token').value;
        const msgDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        if (pass !== confirmPass) {
            msgDiv.style.color = '#dc3545';
            msgDiv.innerText = "Passwords do not match!";
            return;
        }

        submitBtn.innerText = "Updating...";
        submitBtn.disabled = true;

        try {
            const res = await fetch('../backend/auth/reset_password_action.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `token=${encodeURIComponent(tokenValue)}&password=${encodeURIComponent(pass)}`
            });
            
            const data = await res.json();
            
            if(data.status === 'success') {
                clearInterval(countdownInterval); // Itigil ang timer pag success
                document.getElementById('countdownTimer').style.display = 'none'; // Itago ang timer
                msgDiv.style.color = '#28a745';
                msgDiv.innerText = "Success! Redirecting to login...";
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                msgDiv.style.color = '#dc3545';
                msgDiv.innerText = data.message;
                submitBtn.innerText = "Update Password";
                submitBtn.disabled = false;
            }
        } catch (error) {
            msgDiv.style.color = '#dc3545';
            msgDiv.innerText = "Server Error.";
            submitBtn.innerText = "Update Password";
            submitBtn.disabled = false;
        }
    };
</script>

</body>
</html>
