<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | ServiQuick</title>

<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/register.cs">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <a href="../index.html" class="back-btn">
            Back
        </a>

        <div class="auth-title">
            Create Account 🚀
        </div>

        <div class="auth-sub">
            Join ServiQuick today
        </div>

        <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");

        if(error){

            let message="";

            if(error==="password_mismatch") message="Passwords do not match.";
            if(error==="email_exists") message="Email already exists.";

            const div=document.createElement("div");

            div.className="alert alert-error";
            div.textContent=message;

            document.querySelector(".auth-card").prepend(div);

        }
        </script>

        <form action="../backend/auth/register.php" method="POST">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">

    <label>Password</label>

    <div class="password-wrapper">

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create password"
            required>

        <span class="password-toggle" id="togglePassword">
            <i class="fa-solid fa-eye"></i>
        </span>

    </div>

    <div class="password-hint">
        <strong>Password Requirements:</strong>
        <ul>
            <li>Minimum of 6 characters</li>
            <li>At least one uppercase letter (A-Z)</li>
            <li>At least one lowercase letter (a-z)</li>
            <li>At least one number (0-9)</li>
            <li>At least one special character (!@#$%^&*)</li>
        </ul>
    </div>

</div>

<div class="form-group">

    <label>Confirm Password</label>

    <div class="password-wrapper">

        <input
            type="password"
            id="confirmPassword"
            name="confirm_password"
            placeholder="Confirm password"
            required>

        <span class="password-toggle" id="toggleConfirmPassword">
            <i class="fa-solid fa-eye"></i>
        </span>

    </div>

</div>

            <button
                type="submit"
                class="btn btn-blue"
                style="width:100%;height:40px;margin-top:5px;">

                Register

            </button>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>
<div id="toast"></div>
<script src="../assets/js/register.js"></script>

</body>
</html>
