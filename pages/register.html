<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | ServiQuick</title>

<link rel="stylesheet" href="../assets/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    /* ✨ MOBILE RESPONSIVE FIX ✨ */
    .auth-card {
        width: 90%;
        max-width: 420px;
        box-sizing: border-box;
    }
    .form-group input {
        box-sizing: border-box;
        width: 100%;
    }
</style>
</head>

<body>

<div class="auth-container">

<div class="auth-card">

    <script>
const params = new URLSearchParams(window.location.search);
const error = params.get("error");

if(error){
let message = "";

if(error === "password_mismatch") message = "Passwords do not match.";
if(error === "email_exists") message = "Email already exists.";

const div = document.createElement("div");
div.className = "alert alert-error";
div.textContent = message;

document.querySelector(".auth-card").prepend(div);
}
</script>

<div class="auth-title">Create Account 🚀</div>
<div class="auth-sub">Join ServiQuick today</div>

<form action="../backend/auth/register.php" method="POST">

<div class="form-group">
<label>Full Name</label>
<input type="text" name="full_name" placeholder="Enter your name" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" placeholder="Enter your email" required>
</div>

<div class="form-group password-group">
<label>Password</label>
<input type="password" name="password" placeholder="Create password" required>
<span class="password-toggle">👁</span>
</div>

<div class="form-group password-group">
<label>Confirm Password</label>
<input type="password" name="confirm_password" placeholder="Confirm password" required>
<span class="password-toggle">👁</span>
</div>

<button type="submit" class="btn btn-blue" style="width:100%;height:40px;margin-top:10px;">
Register
</button>

</form>

<div class="auth-footer">
Already have an account? 
<a href="login.html">Login</a>
</div>

</div>

</div>

<script src="../assets/js/auth.js"></script>

</body>
</html>
